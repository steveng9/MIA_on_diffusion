name: tabddpm_
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.9
  
  # Core dependencies
  - numpy=1.23.5
  - pandas=1.5.3
  - scipy=1.13.1
  - scikit-learn=1.5.0
  # - matplotlib=3.9.0
  
  # PyTorch and related (for synthcity group)
  - pytorch=1.13.1
  - torchvision=0.14.1
  - cudatoolkit=11.7
  
  # Jupyter
  - ipykernel=6.29.4
  - jupyter
  
  # Basic utilities
  - xlrd=2.0.1
  - tqdm=4.66.4
  - pyyaml=6.0.1
  - requests=2.32.3
  
  # Data processing
  - pyarrow=16.1.0
  - h5py=3.11.0
  
  # ML frameworks
  - xgboost=1.7.6
  - statsmodels=0.14.2
  - imbalanced-learn=0.12.3
  
  # NLP
  - spacy=3.7.5
  - transformers=4.41.2
  
  # Config management
  - hydra-core=1.3.2
  - omegaconf=2.3.0
  
  # Development tools
  - pre-commit=3.7.0
  
  # Install via pip (packages not available or better via pip)
  - pip=24.0
  - pip:
      # FAISS (use CPU version for compatibility)
      - faiss-cpu==1.7.4
      
      # For clavaddpm group
      - sdv==1.11.0
      - prdc==0.2
      
      # For tabsyn group
      - icecream==2.1.3
      - tomli==2.0.1
      - tomli-w==1.0.0
      - click==8.1.7
      - typer==0.12.3
      
      # SynthCity and dependencies
      - synthcity==0.2.10
      - xgbse==0.2.3
      - torchmetrics==1.4.0.post0
      - pytorch-lightning==1.9.5
      - opacus==1.4.0
      - optuna==3.6.1
      - lifelines==0.27.7
      - pycox==0.2.3
      
      # Specialized packages
      - category-encoders==2.6.3
      - gdown==5.2.0
      - accelerate==0.31.0
      - shap==0.45.1
      - be-great==0.0.7
      - decaf-synthetic-data==0.1.6
      - monai==1.3.2
      - tsai==0.3.9
      - pyts==0.13.0
      - nflows==0.14
      - fflows==0.0.3
      
      # Utilities
      - loguru==0.7.2
      - rich==13.7.1
      - colorlog==6.8.2
      
      # If you need GPU support for FAISS (Linux only), uncomment below and comment out faiss-cpu above
      # - faiss-gpu==1.7.2
